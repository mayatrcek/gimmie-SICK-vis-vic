<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Cirrus — Cover</title>
    <link rel="stylesheet" href="../css/system.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      html, body { height: 100%; }
      body {
        width: 1200px;
        height: 800px;
        margin: 0;
        overflow: hidden;
      }

      .cover {
        position: relative;
        width: 1200px;
        height: 800px;
        background-color: var(--color-sky);
        background: linear-gradient(180deg, var(--color-horizon) 0%, var(--color-sky) 72%);
        overflow: hidden;
        font-family: var(--font-sans);
      }

      .cover-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center bottom;
        pointer-events: none;
        z-index: 0;
      }
      .cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(38% 28% at 50% 8%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 60%);
        pointer-events: none;
        z-index: 1;
      }
      .cover::after {
        /* faint vignette at the bottom to ground floating elements */
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 30% at 50% 110%, rgba(14,17,22,0.05) 0%, rgba(14,17,22,0) 60%);
        pointer-events: none;
        z-index: 2;
      }

      .cover-inner {
        position: absolute;
        inset: 0;
        padding: 64px 80px 56px;
        display: grid;
        grid-template-rows: 1fr auto;
        row-gap: 28px;
        z-index: 3;
      }

      /* ---------- top zone ---------- */
      .top {
        position: relative;
      }

      /* Big brand mark inside an ink pill, top-left */
      .mark-anchor {
        position: absolute;
        top: 0;
        left: 0;
        display: inline-grid;
        place-items: center;
        width: 80px;
        height: 80px;
        border-radius: var(--radius-pill);
        background: var(--color-ink);
        color: var(--color-cloud);
        box-shadow: var(--shadow-tier-2);
      }
      .mark-anchor svg { width: 40px; height: 40px; }

      /* Headline block */
      .headline-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 128px;
        text-align: left;
        max-width: 920px;
      }
      .system-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 176px;
        line-height: 0.9;
        letter-spacing: -0.045em;
        color: var(--text-strong);
        margin: 0;
      }
      .system-name .accent-italic {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        font-size: 0.62em;
        padding-inline: 0.06em 0.02em;
        color: var(--color-mist);
        letter-spacing: -0.02em;
        vertical-align: 0.06em;
      }
      .tagline {
        margin: 28px 0 0;
        font-family: var(--font-sans);
        font-weight: 500;
        font-size: 22px;
        line-height: 1.45;
        letter-spacing: -0.005em;
        color: var(--text-strong);
        max-width: 44ch;
      }

      /* ---------- bottom specimen strip ---------- */
      .specimen {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 18px;
        align-items: stretch;
      }

      .card-base {
        background: var(--color-cloud);
        border: var(--border-hairline);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-tier-1);
        padding: 22px 26px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 168px;
      }

      .card-token .row-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--text-muted);
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .card-token .pill {
        background: var(--color-ink);
        color: var(--color-cloud);
        border-radius: var(--radius-pill);
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 500;
      }
      .specimen-text {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.025em;
        color: var(--text-strong);
        margin: 8px 0 12px;
      }
      .specimen-text .ital {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        color: var(--color-mist);
        font-size: 0.94em;
      }
      .specimen-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
      }
      .specimen-meta .stack {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
      }
      .specimen-meta strong {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 14px;
        color: var(--text-strong);
        letter-spacing: -0.01em;
      }

      .card-stat .kpi-mini-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .card-stat .kpi-mini-label svg { width: 14px; height: 14px; }
      .card-stat .kpi-mini-value {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.025em;
        color: var(--text-strong);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        margin: 6px 0 4px;
      }
      .card-stat .kpi-mini-delta {
        font-size: 12px;
        font-weight: 500;
        color: var(--color-meadow);
      }
      .card-stat .progress-mini {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        height: 8px;
        border-radius: var(--radius-pill);
        overflow: hidden;
        background: var(--color-edge-soft);
      }
      .card-stat .progress-mini > span:nth-child(1) { background: var(--color-signal); }
      .card-stat .progress-mini > span:nth-child(2) { background: var(--color-citrus); }
      .card-stat .progress-mini > span:nth-child(3) { background: var(--color-meadow); }

      .card-bars .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .card-bars h5 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 14px;
        color: var(--text-strong);
        margin: 0;
      }
      .card-bars .head em {
        font-size: 11px;
        color: var(--color-meadow);
        font-weight: 500;
      }
      .card-bars .bars {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 80px;
      }
      .card-bars .bars > div {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 2px;
      }
      .card-bars .bars i {
        display: block;
        border-radius: 4px;
      }
      .card-bars .bars i.top {
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
      }

    </style>
  </head>
  <body>
    <div class="cover">
      <img
        class="cover-photo"
        src="../images/sky-horizon-hero.png"
        alt=""
        aria-hidden="true"
        width="3360"
        height="1440"
      />
      <div class="cover-inner">
        <!-- ============ TOP ZONE ============ -->
        <div class="top">
          <!-- Brand mark anchor -->
          <span class="mark-anchor" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359.04 345.39"><path fill="currentColor" d="M352.91,121.03c-11.88-22.12-38.68-32.41-62.29-23.88-4.47,1.61-8.56,3.77-12.23,6.35-5.92,4.17-12.12,7.94-18.7,10.99-.07.03-.12.05-.18.08l-12.97,5.99c-11.23,5.18-24.04-3.02-24.04-15.38v-22.98c0-.25,0-.5.02-.75v-.02c.03-7.03.85-14.04,2.13-20.97.55-3.03.85-6.12.85-9.29C225.48,21.85,200.83-1.7,171.15.1c-25.06,1.51-45.64,21.52-47.79,46.55-.42,4.72-.17,9.34.63,13.75,1.31,7.2,2.14,14.48,2.14,21.79v18.17c0,12.37-12.82,20.56-24.04,15.38l-2.55-1.18c-.6-.28-1.2-.55-1.78-.85-6-2.89-11.67-6.4-17.12-10.22-3.66-2.58-7.75-4.74-12.22-6.35-23.62-8.53-50.41,1.76-62.29,23.88-14.06,26.21-3.01,58.46,23.6,70.72,2.88,1.33,5.82,2.38,8.79,3.12,7.06,1.81,14.01,4.12,20.63,7.18l10.09,4.65,8.55,3.94c10.32,4.76,13.12,18.14,5.56,26.64h0s-1.6,1.8-1.6,1.8c-4.85,5.46-10.29,10.35-16.05,14.83-2.41,1.88-4.69,4.01-6.81,6.39-19.46,21.91-16.69,55.86,6.68,74.25,19.75,15.54,48.42,14.23,66.65-3.04,3.46-3.26,6.33-6.86,8.66-10.7,3.79-6.25,8.01-12.23,12.88-17.7l8.51-9.57,16.02-18.03,16.02,18.03,8.51,9.57c4.85,5.47,9.07,11.45,12.86,17.7,2.33,3.84,5.22,7.45,8.66,10.7,18.23,17.27,46.9,18.58,66.65,3.04,23.39-18.38,26.14-52.34,6.68-74.25-2.08-2.34-4.31-4.43-6.68-6.29-4.42-3.47-8.7-7.1-12.57-11.17l-3.6-3.78-.88-.99c-7.55-8.5-4.76-21.87,5.56-26.63l10.26-4.74,10.09-4.65c6.63-3.06,13.58-5.37,20.64-7.18,2.98-.75,5.92-1.8,8.79-3.12,26.61-12.27,37.66-44.51,23.6-70.72Z"/></svg>
          </span>

          <!-- System name + tagline -->
          <div class="headline-wrap">
            <h1 class="system-name">Cirrus</h1>
            <p class="tagline">
              A minimalist SaaS system staged on a cloudy sky.
            </p>
          </div>
        </div>

        <!-- ============ BOTTOM SPECIMEN ============ -->
        <div>
          <div class="specimen">
            <!-- Type specimen card -->
            <article class="card-base card-token">
              <div class="row-top">
                <span>Display / Inter Tight 700</span>
                <span class="pill">88 / 1.02</span>
              </div>
              <div>
                <div class="specimen-text">Aa <span class="ital">Aa</span></div>
              </div>
              <div class="specimen-meta">
                <span class="stack">
                  <span>Display</span>
                  <strong>Inter Tight</strong>
                </span>
                <span class="stack">
                  <span>Body</span>
                  <strong>Inter</strong>
                </span>
                <span class="stack">
                  <span>Accent</span>
                  <strong style="font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--color-mist);">Instrument Serif</strong>
                </span>
              </div>
            </article>

            <!-- Stat specimen card -->
            <article class="card-base card-stat">
              <span class="kpi-mini-label"><i data-lucide="banknote"></i> Revenue from chats</span>
              <span class="kpi-mini-value">$97,418</span>
              <span class="kpi-mini-delta">↑ 18% month over month</span>
              <div class="progress-mini" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </div>
            </article>

            <!-- Bars specimen card -->
            <article class="card-base card-bars">
              <div>
                <div class="head">
                  <h5>Messages vs. sales</h5>
                  <em>↑ 18%</em>
                </div>
                <div class="bars" aria-hidden="true">
                  <div>
                    <i style="height:8px;background:#FF7A3D;"></i>
                    <i class="top" style="height:28px;background:#2E7DEF;"></i>
                  </div>
                  <div>
                    <i style="height:12px;background:#FF7A3D;"></i>
                    <i class="top" style="height:40px;background:#2E7DEF;"></i>
                  </div>
                  <div>
                    <i style="height:16px;background:#FF7A3D;"></i>
                    <i class="top" style="height:54px;background:#2E7DEF;"></i>
                  </div>
                  <div>
                    <i style="height:22px;background:#FF7A3D;"></i>
                    <i class="top" style="height:64px;background:#2E7DEF;"></i>
                  </div>
                  <div>
                    <i style="height:28px;background:#FF7A3D;"></i>
                    <i class="top" style="height:72px;background:#2E7DEF;"></i>
                  </div>
                  <div>
                    <i class="top" style="height:48px;background:repeating-linear-gradient(135deg,#E3E8EE 0 6px,transparent 6px 12px);border:1px solid #E3E8EE;"></i>
                  </div>
                </div>
              </div>
            </article>
          </div>

        </div>
      </div>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
